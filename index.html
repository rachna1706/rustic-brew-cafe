<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Rustic Brew ☕︎</title>
<style>
  :root{
    --brand:#5c4033;      /* deep brown */
    --light:#f5f0e6;      /* beige background */
    --card:#fffaf3;       /* creamy card */
    --muted:#7a6a53;      /* muted brown-gray */
    --accent:#c97b3d;     /* caramel accent */
    --border:#e0d5c5;     /* warm border */
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Georgia, serif;background:var(--light);color:#3a2c1a}

  /* Header */
  header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:2px solid var(--border);
         display:flex;align-items:center;gap:14px;padding:10px 16px}
  #logo{height:56px}
  header h1{font-size:20px;margin:0;color:var(--brand)}
  #langBadge{margin-left:auto;color:var(--muted);font-size:14px}

  /* Login */
  #screen-login{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:url('https://i.pinimg.com/1200x/0a/19/ea/0a19ea5e5ffc9263e742a5d0a5343991.jpg') no-repeat center/cover;
    padding:20px;
  }
  #login-card{
    width:96%;max-width:420px;background:rgba(255,250,243,.96);
    border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 8px 20px rgba(0,0,0,.25)
  }
  #login-card h2{margin:10px 0 6px}
  .field{margin:8px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .input, select{
    width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:#fff
  }
  .btn{padding:10px 14px;border:none;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;font-weight:700}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .muted{color:var(--muted)}
  .center{text-align:center}

  /* Main */
  #screen-main{display:none}
  #navbar{
    display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:12px;border-bottom:1px solid var(--border);background:var(--card)
  }
  #navbar button{border:1px solid var(--border);background:#f8f3ea;color:#3a2c1a;border-radius:999px;padding:8px 12px;cursor:pointer}
  #navbar button:hover{background:#efe3cf}

  .wrap{padding:18px}
  .category{margin:20px 0}
  .category h2{color:var(--brand);margin:0 0 10px;border-bottom:2px solid var(--border);padding-bottom:6px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
  .card img{width:100%;height:160px;object-fit:cover}
  .card-body{padding:12px}
  .flex{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .price{color:var(--accent);font-weight:700}
  .add-btn{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:8px 12px;cursor:pointer}

  /* Cart */
  #cartDock{
    position:fixed;right:18px;bottom:18px;background:var(--card);border:1px solid var(--border);
    border-radius:14px;width:320px;max-height:70vh;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.18);display:none
  }
  #cartDock header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border)}
  #cartList{list-style:none;margin:0;padding:0}
  #cartList li{padding:10px 12px;border-bottom:1px dashed var(--border);font-size:14px}
  #cartList .meta{color:var(--muted);font-size:12px;margin-top:4px}
  #cartTotalRow{padding:12px;display:flex;justify-content:space-between;align-items:center}

  /* Modal */
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal{background:#fff;border:1px solid var(--border);border-radius:16px;width:96%;max-width:560px;max-height:86vh;overflow:auto}
  .m-head{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--border)}
  .thumb{width:84px;height:84px;object-fit:cover;border-radius:12px;border:1px solid var(--border)}
  .m-body{padding:12px}
  .group{border:1px dashed var(--border);border-radius:12px;padding:10px;margin:10px 0}
  .row{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
  .row label{display:flex;align-items:center;gap:8px}
  .pill{display:inline-block;margin:6px 6px 0 0;padding:6px 10px;border:1px solid var(--border);border-radius:999px}
  .qty{display:flex;align-items:center;gap:8px}
  .qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer}
  .m-foot{display:flex;gap:10px;justify-content:flex-end;padding:12px;border-top:1px solid var(--border)}
  .notes{width:100%;min-height:56px;border:1px solid var(--border);border-radius:10px;padding:8px}

  /* Helpers */
  .hidden{display:none!important}
</style>
</head>

/* ===================== STATE ===================== */
let STATE = { user:null, cart:[] };

/* ===================== LOGIN ===================== */
const nameInput = document.getElementById("nameInput");
const phoneInput = document.getElementById("phoneInput");
const langSelect = document.getElementById("langSelect");
const startBtn   = document.getElementById("startBtn");

function applyLoginI18N(){
  document.getElementById("title").textContent = t("siteTitle");
  document.getElementById("loginWelcome").textContent = t("loginWelcome");
  document.getElementById("loginSub").textContent     = t("loginSub");
  document.getElementById("labelName").textContent    = t("name");
  document.getElementById("labelPhone").textContent   = t("phone");
  document.getElementById("labelLang").textContent    = t("language");
  startBtn.textContent                                = t("start");
  document.getElementById("disclaimer").textContent   = t("privacy");
}
applyLoginI18N();

function digitsOnly(s){ return (s||"").replace(/\D/g,""); }
function validateLogin(){
  const okName  = nameInput.value.trim().length >= 2;
  const phoneDigits = digitsOnly(phoneInput.value);
  const okPhone = phoneDigits.length === 10;  // exactly 10 digits, ignoring spaces/dashes
  startBtn.disabled = !(okName && okPhone);
}

nameInput.addEventListener("input", validateLogin);
phoneInput.addEventListener("input", validateLogin);

langSelect.onchange = () => {
  LANG = langSelect.value;
  document.getElementById("langBadge").textContent = LANG.toUpperCase();
  applyLoginI18N();
};

startBtn.onclick = async () => {
  validateLogin();
  if(startBtn.disabled) return;

  LANG = langSelect.value;
  const name = nameInput.value.trim();
  const phone = digitsOnly(phoneInput.value);

  try{
    startBtn.disabled = true;
    startBtn.textContent = "Connecting...";

    const response = await fetch("/api/customer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, phone, lang: LANG })
    });

    const data = await response.json();
    console.log("Customer API response:", response.status, data);

    if(!response.ok || !data.success){
      throw new Error(data.message || "Customer could not be saved.");
    }

    STATE.user = { id: data.customer_id, name, phone, lang: LANG };

    document.getElementById("topbar").classList.remove("hidden");
    document.getElementById("screen-login").style.display = "none";
    document.getElementById("screen-main").style.display = "block";
    document.getElementById("langBadge").textContent = LANG.toUpperCase();
    renderAll();

  }catch(error){
    console.error("Customer save failed:", error);
    alert(`❌ Could not connect to the server.\n\n${error.message}\n\nPlease try again.`);
    startBtn.disabled = false;
    startBtn.textContent = t("start");
  }
};

/* ===================== RENDER ===================== */
function renderAll(){
  // Navbar categories
  const nav = document.getElementById("navbar");
  nav.innerHTML = MENU.map(cat => 
    `<button onclick="scrollToCat('${cat.key}')">${cat.title[LANG] || cat.title.en}</button>`
  ).join("");

  // Title (topbar)
  document.getElementById("title").textContent = t("siteTitle");

  // Menu sections
  const wrap = document.getElementById("menuWrap");
  wrap.innerHTML = MENU.map(cat => `
    <section class="category" id="${cat.key}">
      <h2>${cat.title[LANG] || cat.title.en}</h2>
      <div class="grid">
        ${cat.items.map(item => `
          <article class="card">
            <img src="${item.img}" alt="${item.name[LANG] || item.name.en}">
            <div class="card-body">
              <div class="flex">
                <h3 style="margin:0">${item.name[LANG] || item.name.en}</h3>
                <span class="price">₹${item.price}</span>
              </div>
              <button class="add-btn" onclick="openCustomize('${cat.key}','${item.id}')">${t("menuBtn")}</button>
            </div>
          </article>
        `).join("")}
      </div>
    </section>
  `).join("");

  // Cart labels
  document.getElementById("cartTitle").textContent = t("cart.title");
  document.getElementById("checkoutBtn").textContent = t("cart.checkout");
  document.getElementById("cartTotalLabel").innerHTML = `<b>${t("cart.total")}</b>`;
  updateCart();
}

function scrollToCat(id){ document.getElementById(id).scrollIntoView({behavior:"smooth"}); }

/* ===================== CUSTOMIZE MODAL ===================== */
let CURRENT = null; // {cat, item}

function openCustomize(catKey, itemId){
  const cat = MENU.find(c=>c.key===catKey);
  const item = cat.items.find(i=>i.id===itemId);
  CURRENT = {cat, item};

  const size = item.size||[];
  const addons = item.addons||[];
  const choices = item.choices||[];

  const backdrop = document.createElement("div");
  backdrop.className = "backdrop";
  backdrop.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true">
      <div class="m-head">
        <img class="thumb" src="${item.img}" alt="${item.name[LANG] || item.name.en}">
        <div>
          <h3 style="margin:0">${item.name[LANG] || item.name.en}</h3>
          <div class="muted">${t("modal.total")}: ₹<span id="calcTotal">${item.price}</span></div>
        </div>
        <button class="btn" style="margin-left:auto;background:#fff;color:#3a2c1a;border:1px solid var(--border)" onclick="closeModal(this)">✕</button>
      </div>
      <div class="m-body">
        ${size.length?`
          <div class="group">
            <b>${t("modal.size")}</b>
            ${size.map((s,idx)=>`
              <div class="row">
                <label><input type="radio" name="size" value="${s.d}" ${idx===0?"checked":""}> ${s.n}</label>
                <span class="muted">${s.d>0?`+₹${s.d}`:"Included"}</span>
              </div>
            `).join("")}
          </div>`:""}
        ${addons.length?`
          <div class="group">
            <b>${t("modal.addons")}</b>
            <div>
              ${addons.map(a=>`
                <label class="pill">
                  <input type="checkbox" name="addon" value="${a.n}" data-price="${a.p}"> ${a.n} (+₹${a.p})
                </label>
              `).join("")}
            </div>
          </div>`:""}
        ${choices.length?`
          <div class="group">
            <b>${t("modal.choices")}</b>
            ${choices.map((c,ci)=>`
              <div class="row" style="align-items:center">
                <label style="min-width:120px">${c.label}</label>
                <select data-idx="${ci}">
                  ${c.items.map(opt=>`<option>${opt}</option>`).join("")}
                </select>
              </div>
            `).join("")}
          </div>`:""}
        <div class="group">
          <b>${t("modal.qty")}</b>
          <div class="qty">
            <button onclick="chgQty(-1)">-</button>
            <span id="qtyVal">1</span>
            <button onclick="chgQty(1)">+</button>
          </div>
        </div>
        <div class="group">
          <b>${t("modal.notes")}</b>
          <textarea class="notes" id="notesBox" placeholder="e.g., less sugar, extra hot"></textarea>
        </div>
      </div>
      <div class="m-foot">
        <button class="btn" style="background:#fff;color:#3a2c1a;border:1px solid var(--border)" onclick="closeModal(this)">${t("modal.cancel")}</button>
        <button class="btn" onclick="confirmAdd()">${t("modal.add")}</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  backdrop.addEventListener("change", recomputePrice);
  recomputePrice();
}

function closeModal(btn){
  const back = btn.closest(".backdrop") || document.querySelector(".backdrop");
  if(back) back.remove();
  CURRENT = null;
}

function getModalEl(){ return document.querySelector(".backdrop"); }

function chgQty(delta){
  const el = getModalEl().querySelector("#qtyVal");
  let v = parseInt(el.textContent,10);
  v = Math.max(1, v + delta);
  el.textContent = v;
  recomputePrice();
}

function recomputePrice(){
  if(!CURRENT) return;
  const {item} = CURRENT;
  const modal = getModalEl();
  let total = item.price;

  // size
  const s = modal.querySelector('input[name="size"]:checked');
  if(s) total += parseInt(s.value,10);

  // addons
  modal.querySelectorAll('input[name="addon"]:checked').forEach(cb=>{
    total += parseInt(cb.dataset.price,10);
  });

  // choices with priceMap
  (item.choices||[]).forEach((c,idx)=>{
    const sel = modal.querySelector(`select[data-idx="${idx}"]`);
    if(!sel) return;
    const val = sel.value;
    const map = c.priceMap||{};
    if(map[val]) total += map[val];
  });

  // qty
  const qty = parseInt(modal.querySelector("#qtyVal").textContent,10);
  total = total * qty;

  modal.querySelector("#calcTotal").textContent = total;
}

function confirmAdd(){
  const modal = getModalEl();
  const {item} = CURRENT;

  const size = modal.querySelector('input[name="size"]:checked')?.nextSibling?.textContent?.trim() || "";
  const addons = [...modal.querySelectorAll('input[name="addon"]:checked')].map(cb=>cb.value);
  const choose = (item.choices||[]).map((c,idx)=>{
    const val = modal.querySelector(`select[data-idx="${idx}"]`)?.value || "";
    return {label:c.label, value:val};
  });
  const qty = parseInt(modal.querySelector("#qtyVal").textContent,10);
  const notes = modal.querySelector("#notesBox").value.trim();
  const total = parseInt(modal.querySelector("#calcTotal").textContent,10);

  STATE.cart.push({ id:item.id, name:item.name[LANG] || item.name.en, size, addons, choose, qty, notes, total });
  closeModal(modal.querySelector("button"));
  updateCart(true);
}

/* ===================== CART ===================== */
function updateCart(open){
  const dock = document.getElementById("cartDock");
  const list = document.getElementById("cartList");
  const totalEl = document.getElementById("cartTotal");
  const items = STATE.cart;

  if(items.length===0){
    list.innerHTML = `<li class="muted">${t("cart.empty")}</li>`;
    totalEl.textContent = "0";
    dock.style.display = "none";
    return;
  }

  dock.style.display = "block";
  let sum = 0;
  list.innerHTML = items.map((c,i)=> {
    sum += c.total;
    const opts = [];
    if(c.size) opts.push(c.size);
    if(c.addons?.length) opts.push("Add-ons: "+c.addons.join(", "));
    if(c.choose?.length) opts.push(...c.choose.filter(k=>k.value).map(k=>`${k.label}: ${k.value}`));
    const notes = c.notes? `<div class="meta">📝 ${c.notes}</div>`:"";
    return `<li>
      <div class="flex">
        <div><b>${c.name}</b> × ${c.qty}<div class="meta">${opts.join(" | ")||""}</div>${notes}</div>
        <div>₹${c.total}</div>
      </div>
      <div class="flex" style="margin-top:6px">
        <button class="btn" style="background:#fff;color:#3a2c1a;border:1px solid var(--border)" onclick="removeItem(${i})">Remove</button>
      </div>
    </li>`;
  }).join("");

  totalEl.textContent = sum;
  if(open) dock.style.display = "block";
}

function removeItem(idx){
  STATE.cart.splice(idx,1);
  updateCart();
}

/* ===================== CHECKOUT ENHANCEMENTS ===================== */
function generateOrderID() {
  return 'ORD-' + Math.floor(Math.random()*90000+10000);
}

document.getElementById("checkoutBtn").onclick = () => {
  if(STATE.cart.length===0) return alert(t("cart.empty"));

  const orderID = generateOrderID();
  const totalAmount = STATE.cart.reduce((sum,c)=>sum+c.total,0);

  // Create checkout modal
  const backdrop = document.createElement("div");
  backdrop.className = "backdrop";
  backdrop.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true">
      <div class="m-head">
        <h3>Checkout</h3>
        <button class="btn" style="margin-left:auto;background:#fff;color:#3a2c1a;border:1px solid var(--border)" onclick="closeModal(this)">✕</button>
      </div>
      <div class="m-body">
        <p><b>Total Amount:</b> ₹${totalAmount}</p>
        <div class="group">
          <b>Split Payment</b>
          <input type="number" id="splitCount" min="1" value="1" class="input" placeholder="Number of people to split"/>
        </div>
        <div class="group">
          <b>Payment Method</b>
          <div>
            <label class="pill"><input type="radio" name="payMethod" value="qr" checked> Pay via QR</label>
            <label class="pill"><input type="radio" name="payMethod" value="upi"> UPI ID</label>
            <label class="pill"><input type="radio" name="payMethod" value="netbanking"> Netbanking</label>
            <label class="pill"><input type="radio" name="payMethod" value="waiter"> Call Waiter to Collect</label>
          </div>
        </div>
        <div class="group" id="upiField" style="display:none">
          <label>Enter UPI ID</label>
          <input type="text" class="input" id="upiInput" placeholder="example@upi"/>
        </div>
      </div>
      <div class="m-foot">
        <button class="btn" style="background:#fff;color:#3a2c1a;border:1px solid var(--border)" onclick="closeModal(this)">Cancel</button>
        <button class="btn" onclick="confirmCheckout('${orderID}')">Confirm Payment</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);

  // Show/hide UPI field based on method
  backdrop.querySelectorAll('input[name="payMethod"]').forEach(radio => {
    radio.onchange = () => {
      const upiField = document.getElementById("upiField");
      upiField.style.display = (radio.value==="upi") ? "block" : "none";
    };
  });
};

async function confirmCheckout(orderID){
  const modal = getModalEl();
  if(!modal){
    alert("Checkout window could not be found. Please try again.");
    return;
  }

  const totalAmount = STATE.cart.reduce((sum,c)=>sum+c.total,0);
  const split = parseInt(modal.querySelector("#splitCount").value)||1;
  const method = modal.querySelector('input[name="payMethod"]:checked')?.value || "qr";
  const upiID = modal.querySelector("#upiInput")?.value || "";

  let paymentMsg = "";
  switch(method){
    case "qr": paymentMsg = "Please scan the QR code at your table to pay."; break;
    case "upi": paymentMsg = `Please pay ₹${(totalAmount/split).toFixed(2)} to UPI ID: ${upiID || "[missing]"}.`; break;
    case "netbanking": paymentMsg = `Netbanking selected. Amount per person: ₹${(totalAmount/split).toFixed(2)}.`; break;
    case "waiter": paymentMsg = "A waiter will come to collect your payment at your table."; break;
  }

  const orderPayload = {
    customer_id: STATE.user?.id || 0,
    order_id: orderID,
    // Send cart as JSON text so PostgreSQL JSONB accepts it reliably
    order_details: JSON.stringify(STATE.cart),
    total_amount: totalAmount,
    payment_method: method
  };

  try{
    console.log("Sending order to server:", orderPayload);

    const response = await fetch("/api/order", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(orderPayload)
    });

    const data = await response.json();
    console.log("Order API response:", response.status, data);

    if(!response.ok || !data.success){
      throw new Error(data.message || "The server could not save the order.");
    }

    closeModal(modal.querySelector("button"));

    alert(`✅ Thank you for ordering with us!

Order ID: ${orderID}
Total: ₹${totalAmount}
Split among: ${split} person(s)
Payment: ${method.toUpperCase()}

${paymentMsg}

Your order has been saved successfully.
Your order will take approximately 15-20 minutes to prepare. Enjoy!`);

    STATE.cart = [];
    updateCart();

  }catch(error){
    console.error("Order save failed:", error);
    alert(`❌ Order could not be saved.

${error.message}

Please try again.`);
  }
}
